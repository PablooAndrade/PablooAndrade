<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Pablo Andrade — Code. Learn. Go Beyond.</title>
  <desc id="desc">A dark technical panel with bold white typography, green energy bolts, fine grid lines, and yellow accents.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8297aa" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111c27"/>
      <stop offset="1" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b6ffd7"/>
      <stop offset=".45" stop-color="#46f7a0"/>
      <stop offset="1" stop-color="#15b975"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#46f7a0" stop-opacity=".13"/>
      <stop offset="1" stop-color="#46f7a0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="398" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <path fill="#0b1018" d="M0 0h1200v400H0z"/>
    <path fill="url(#surface)" d="M813 0h387v400H696z"/>
    <path fill="url(#grid)" d="M0 0h1200v400H0z"/>
    <ellipse cx="961" cy="201" rx="255" ry="241" fill="url(#aura)"/>

    <!-- Fine framing and circuit traces keep the energy motif grounded. -->
    <g fill="none" stroke="#304239" stroke-width="1">
      <path d="M807 23 704 377"/>
      <path d="M842 51h217l77 77v153l-56 56H799"/>
      <path d="M851 65h202l69 69v139l-51 50H839" stroke-opacity=".5"/>
      <circle cx="964" cy="198" r="130" stroke-dasharray="3 12"/>
      <path d="M964 57v28m0 226v28M823 198h28m226 0h28"/>
      <path d="M40 351h22m-11-11v22M1138 351h22m-11-11v22" stroke="#61727d"/>
    </g>
    <path d="M813 0 774 132" fill="none" stroke="#46f7a0" stroke-opacity=".42" stroke-width="2"/>
    <path d="M724 300 696 400" fill="none" stroke="#46f7a0" stroke-opacity=".24" stroke-width="2"/>
    <g fill="#46f7a0">
      <circle cx="842" cy="51" r="3"/>
      <circle cx="799" cy="337" r="3"/>
      <circle cx="1136" cy="198" r="3"/>
    </g>

    <!-- Original angular energy mark, with a restrained offset outline. -->
    <path d="m1000 60-164 166 108-19-64 133 209-199-111 21 82-102Z" fill="#46f7a0" fill-opacity=".045" stroke="#46f7a0" stroke-opacity=".33" stroke-width="2" transform="translate(15 13)"/>
    <path d="m1000 60-164 166 108-19-64 133 209-199-111 21 82-102Z" fill="url(#energy)"/>
    <path d="m1000 60-164 166 108-19" fill="none" stroke="#c8ffe0" stroke-width="2" stroke-linejoin="round"/>
    <path d="m874 102-40 39 24-4-21 40 52-54-27 7Z" fill="#f5df65"/>
    <path d="m1100 249-36 35 20-3-17 35 49-49-23 5Z" fill="#46f7a0" fill-opacity=".67"/>
    <path d="m1039 335 16-16m-3 18 16-16m-3 18 16-16" stroke="#f5df65" stroke-width="3"/>

    <g font-family="Consolas, 'Liberation Mono', monospace">
      <path d="m64 53 11-11h12L76 53Z" fill="#46f7a0"/>
      <text x="100" y="55" fill="#b0bfc9" font-size="18" letter-spacing="1.5">@PablooAndrade</text>
      <text x="60" y="163" fill="#f3f7f8" font-size="84" font-weight="700" letter-spacing="8">PABLO</text>
      <text x="60" y="250" fill="#f3f7f8" font-size="84" font-weight="700" letter-spacing="8">ANDRADE<tspan fill="#46f7a0">.</tspan></text>
      <path d="M64 281h46" stroke="#46f7a0" stroke-width="3"/>
      <text x="64" y="321" fill="#d2dce1" font-size="20" letter-spacing="2">CODE. LEARN. <tspan fill="#46f7a0">GO BEYOND.</tspan></text>
      <text x="65" y="369" fill="#8194a2" font-size="13" letter-spacing="2">UBERLÂNDIA · MG · BRASIL</text>
      <text x="1104" y="369" fill="#8194a2" font-size="12" text-anchor="end" letter-spacing="2">PLUS ULTRA</text>
    </g>

    <path d="M32 1h85" stroke="#46f7a0" stroke-width="3"/>
    <path d="M1074 399h92" stroke="#f5df65" stroke-width="3"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="398.5" rx="18" fill="none" stroke="#263540" stroke-width="1.5"/>
</svg>
